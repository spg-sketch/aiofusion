openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Insights
    description: Public Insights content and authenticated editorial management.
  - name: Storage
    description: Direct image uploads for the Insights media library.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /insights:
    get:
      tags: [Insights]
      operationId: listPublishedInsights
      summary: List published Insights stories
      responses:
        '200':
          description: Published Insights stories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsightArticle'
  /insights/{slug}:
    get:
      tags: [Insights]
      operationId: getPublishedInsight
      summary: Get a published Insights story by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published story.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightArticle'
        '404':
          description: Story not found or not published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/insights:
    get:
      tags: [Insights]
      operationId: listAdminInsights
      summary: List all Insights stories for editors
      responses:
        '200':
          description: All editorial stories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsightArticle'
    post:
      tags: [Insights]
      operationId: createAdminInsight
      summary: Create an Insights story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightArticleInput'
      responses:
        '201':
          description: Story created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightArticle'
        '400':
          description: Invalid story.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/insights/{id}:
    patch:
      tags: [Insights]
      operationId: updateAdminInsight
      summary: Update an Insights story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightArticleInput'
      responses:
        '200':
          description: Story updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightArticle'
        '400':
          description: Invalid story.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Story not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Insights]
      operationId: deleteAdminInsight
      summary: Delete an Insights story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Story deleted.
  /admin/insights/media:
    get:
      tags: [Insights]
      operationId: listAdminInsightMedia
      summary: List media library images
      responses:
        '200':
          description: Media library.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsightMedia'
  /admin/insights/media/metadata:
    post:
      tags: [Insights]
      operationId: createAdminInsightMedia
      summary: Save uploaded image metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightMediaInput'
      responses:
        '201':
          description: Media saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightMedia'
  /store/media-db/recommendations/brief:
    get:
      tags: [Media Database]
      operationId: getMediaRecommendationBrief
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/StoryKey' }
      responses:
        '200':
          description: Saved targeting brief.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationBriefEnvelope' }
    put:
      tags: [Media Database]
      operationId: saveMediaRecommendationBrief
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationBriefRequest' }
      responses:
        '200':
          description: Brief saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationBriefEnvelope' }
  /store/media-db/discoveries:
    get:
      tags: [Media Database]
      operationId: listMediaDiscoveries
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected], default: pending }
        - { $ref: '#/components/parameters/ProjectIdOptional' }
      responses:
        '200':
          description: Discovery approval queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDiscoveryListEnvelope' }
    post:
      tags: [Media Database]
      operationId: saveMediaDiscovery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaDiscoveryInput' }
      responses:
        '200':
          description: Existing candidate returned idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDiscoveryEnvelope' }
        '201':
          description: Candidate queued for explicit human approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDiscoveryEnvelope' }
  /store/media-db/discoveries/{id}/approve:
    post:
      tags: [Media Database]
      operationId: approveMediaDiscovery
      parameters:
        - { $ref: '#/components/parameters/DiscoveryId' }
      responses:
        '200':
          description: Discovery approved and promoted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDiscoveryApprovalEnvelope' }
  /store/media-db/discoveries/{id}/reject:
    post:
      tags: [Media Database]
      operationId: rejectMediaDiscovery
      parameters:
        - { $ref: '#/components/parameters/DiscoveryId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaDiscoveryRejectInput' }
      responses:
        '200':
          description: Discovery rejected without deleting the candidate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDiscoveryEnvelope' }
  /store/media-db/discovery-instructions:
    get:
      tags: [Media Database]
      operationId: getMediaDiscoveryInstructions
      responses:
        '200':
          description: Workspace discovery instructions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDiscoveryInstructionsEnvelope' }
    put:
      tags: [Media Database]
      operationId: updateMediaDiscoveryInstructions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaDiscoveryInstructionsInput' }
      responses:
        '200':
          description: Updated workspace discovery instructions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaDiscoveryInstructionsEnvelope' }
  /store/media-db/recommendations:
    get:
      tags: [Media Database]
      operationId: getMediaRecommendations
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/StoryKey' }
      responses:
        '200': { description: Saved recommendation envelope. }
    post:
      tags: [Media Database]
      operationId: createMediaRecommendations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200': { description: Recommendation envelope. }
  /store/media-db/recommendations/enrich:
    post:
      tags: [Media Database]
      operationId: enrichMediaRecommendations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationEnrichRequest' }
      responses:
        '200': { description: Refreshed recommendation envelope. }
  /store/media-db/recommendations/contact-restriction:
    post:
      tags: [Media Database]
      operationId: setMediaRecommendationContactRestriction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactRestrictionRequest' }
      responses:
        '200': { description: Restriction saved. }
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestInsightUploadUrl
      summary: Request a direct image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    ProjectId:
      name: projectId
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    ProjectIdOptional:
      name: projectId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    DiscoveryId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    StoryKey:
      name: storyKey
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  schemas:
    TargetingBrief:
      type: object
      required: [topic, angle, audience, regions, publicationTypes, whyNow]
      properties:
        topic: { type: string }
        angle: { type: string }
        audience: { type: string }
        regions: { type: array, items: { type: string } }
        publicationTypes: { type: array, items: { type: string } }
        whyNow: { type: string }
    RecommendationBriefRequest:
      type: object
      required: [projectId, storyKey, brief]
      properties:
        projectId: { type: string }
        storyKey: { type: string }
        brief: { $ref: '#/components/schemas/TargetingBrief' }
    RecommendationBriefEnvelope:
      type: object
      required: [brief]
      properties:
        brief:
          oneOf:
            - { $ref: '#/components/schemas/TargetingBrief' }
            - { type: 'null' }
    RecommendationRequest:
      type: object
      required: [projectId, storyKey]
      properties:
        projectId: { type: string }
        storyKey: { type: string }
        terms: { type: array, items: { type: string } }
        targetPhrases: { type: array, items: { type: object } }
        brief: { $ref: '#/components/schemas/TargetingBrief' }
    RecommendationEnrichRequest:
      type: object
      required: [projectId, storyKey, recommendationSetId]
      properties:
        projectId: { type: string }
        storyKey: { type: string }
        recommendationSetId: { type: integer, minimum: 1 }
    ContactRestrictionRequest:
      type: object
      required: [projectId, storyKey, contactId, doNotContact]
      properties:
        projectId: { type: string }
        storyKey: { type: string }
        contactId: { type: integer, minimum: 1 }
        doNotContact: { type: boolean }
    MediaDiscoveryCandidate:
      type: object
      additionalProperties: true
      required: [candidateKey, firstName, lastName, role, email, outletName, outletWebsite, sourceUrl, evidence, beats, confidence, verifiedAt]
      properties:
        candidateKey: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string }
        email: { type: string }
        outletName: { type: string }
        outletWebsite: { type: string }
        sourceUrl: { type: string }
        evidence: { type: string }
        beats: { type: array, items: { type: string } }
        sectors: { type: array, items: { type: string } }
        geography: { type: string }
        confidence: { type: string, enum: [High, Medium, Low] }
        verifiedAt: { type: string, format: date-time }
    MediaDiscovery:
      type: object
      required: [id, accountId, projectId, status, candidate, createdAt, reviewedAt, reviewedBy, rejectionReason, contactId, outletId]
      properties:
        id: { type: integer }
        accountId: { type: string }
        projectId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        candidate: { $ref: '#/components/schemas/MediaDiscoveryCandidate' }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'] }
        rejectionReason: { type: [string, 'null'] }
        contactId: { type: [integer, 'null'] }
        outletId: { type: [integer, 'null'] }
    MediaDiscoveryInput:
      type: object
      required: [discoveryToken, candidateKey]
      properties:
        discoveryToken: { type: string, minLength: 1 }
        candidateKey: { type: string, minLength: 1 }
    MediaDiscoveryRejectInput:
      type: object
      properties:
        reason: { type: string, maxLength: 4000 }
    MediaDiscoveryEnvelope:
      type: object
      required: [ok, discovery]
      properties:
        ok: { type: boolean }
        discovery: { $ref: '#/components/schemas/MediaDiscovery' }
    MediaDiscoveryListEnvelope:
      type: object
      required: [ok, items, canReview]
      properties:
        ok: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/MediaDiscovery' } }
        canReview: { type: boolean }
    MediaDiscoveryApprovalEnvelope:
      type: object
      required: [ok, discovery, contact, outlet, existing]
      properties:
        ok: { type: boolean }
        discovery: { $ref: '#/components/schemas/MediaDiscovery' }
        contact: { type: object, additionalProperties: true }
        outlet: { type: object, additionalProperties: true }
        existing: { type: boolean }
    MediaDiscoveryInstructionsInput:
      type: object
      required: [instructions, version]
      properties:
        instructions: { type: string, minLength: 50, maxLength: 12000 }
        version: { type: integer, minimum: 0 }
    MediaDiscoveryInstructionsEnvelope:
      type: object
      required: [ok, instructions, defaultInstructions, version, updatedAt, canEdit]
      properties:
        ok: { type: boolean }
        instructions: { type: string }
        defaultInstructions: { type: string }
        version: { type: integer }
        updatedAt: { type: [string, 'null'], format: date-time }
        canEdit: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        features:
          type: array
          items:
            type: string
          description: Names of active server-side feature flags. Empty on production; lists enabled flags on staging.
        releaseRevision:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Verified Git revision supplied by the guarded staging publisher, when available.
      required:
        - status
        - features
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    InsightBlock:
      type: object
      additionalProperties: true
      required: [type]
      properties:
        type:
          type: string
        text:
          type: string
        items:
          type: array
          items:
            type: string
        mediaId:
          type: string
        altText:
          type: string
        caption:
          type: string
    InsightArticle:
      type: object
      required: [id, slug, title, excerpt, tag, body, status, pinned, coverImageUrl, coverImageAlt, seoTitle, seoDescription, focusKeyphrase, canonicalUrl]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        tag: { type: string }
        externalUrl: { type: [string, 'null'] }
        datePublished: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
        body:
          type: array
          items:
            $ref: '#/components/schemas/InsightBlock'
        coverImageUrl: { type: [string, 'null'] }
        coverImageAlt: { type: string }
        seoTitle: { type: [string, 'null'] }
        seoDescription: { type: [string, 'null'] }
        focusKeyphrase: { type: [string, 'null'] }
        canonicalUrl: { type: [string, 'null'] }
        status: { type: string }
        pinned: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
    InsightArticleInput:
      type: object
      required: [slug, title, excerpt, tag, body, status, coverImageAlt]
      properties:
        slug: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        excerpt: { type: string }
        tag: { type: string }
        externalUrl: { type: [string, 'null'] }
        datePublished: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
        body:
          type: array
          items:
            $ref: '#/components/schemas/InsightBlock'
        coverMediaId: { type: [string, 'null'] }
        coverImageUrl: { type: [string, 'null'] }
        coverImageAlt: { type: string }
        seoTitle: { type: [string, 'null'] }
        seoDescription: { type: [string, 'null'] }
        focusKeyphrase: { type: [string, 'null'] }
        canonicalUrl: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published] }
        pinned: { type: boolean }
    InsightMedia:
      type: object
      required: [id, fileName, contentType, sizeBytes, publicUrl, altText, createdAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: string }
        objectPath: { type: [string, 'null'] }
        publicUrl: { type: string }
        altText: { type: string }
        createdAt: { type: string, format: date-time }
    InsightMediaInput:
      type: object
      required: [id, fileName, contentType, sizeBytes, publicUrl, altText]
      properties:
        id: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: string }
        objectPath: { type: [string, 'null'] }
        publicUrl: { type: string }
        altText: { type: string }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
