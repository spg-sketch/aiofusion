openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Insights
    description: Public Insights content and authenticated editorial management.
  - name: Storage
    description: Direct image uploads for the Insights media library.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /insights:
    get:
      tags: [Insights]
      operationId: listPublishedInsights
      summary: List published Insights stories
      responses:
        '200':
          description: Published Insights stories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsightArticle'
  /insights/{slug}:
    get:
      tags: [Insights]
      operationId: getPublishedInsight
      summary: Get a published Insights story by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published story.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightArticle'
        '404':
          description: Story not found or not published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/insights:
    get:
      tags: [Insights]
      operationId: listAdminInsights
      summary: List all Insights stories for editors
      responses:
        '200':
          description: All editorial stories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsightArticle'
    post:
      tags: [Insights]
      operationId: createAdminInsight
      summary: Create an Insights story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightArticleInput'
      responses:
        '201':
          description: Story created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightArticle'
        '400':
          description: Invalid story.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/insights/{id}:
    patch:
      tags: [Insights]
      operationId: updateAdminInsight
      summary: Update an Insights story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightArticleInput'
      responses:
        '200':
          description: Story updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightArticle'
        '400':
          description: Invalid story.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Story not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Insights]
      operationId: deleteAdminInsight
      summary: Delete an Insights story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Story deleted.
  /admin/insights/media:
    get:
      tags: [Insights]
      operationId: listAdminInsightMedia
      summary: List media library images
      responses:
        '200':
          description: Media library.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsightMedia'
  /admin/insights/media/metadata:
    post:
      tags: [Insights]
      operationId: createAdminInsightMedia
      summary: Save uploaded image metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightMediaInput'
      responses:
        '201':
          description: Media saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightMedia'
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestInsightUploadUrl
      summary: Request a direct image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        features:
          type: array
          items:
            type: string
          description: Names of active server-side feature flags. Empty on production; lists enabled flags on staging.
      required:
        - status
        - features
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    InsightBlock:
      type: object
      additionalProperties: true
      required: [type]
      properties:
        type:
          type: string
        text:
          type: string
        items:
          type: array
          items:
            type: string
        mediaId:
          type: string
        altText:
          type: string
        caption:
          type: string
    InsightArticle:
      type: object
      required: [id, slug, title, excerpt, tag, body, status, pinned, coverImageUrl, coverImageAlt, seoTitle, seoDescription, focusKeyphrase, canonicalUrl]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        tag: { type: string }
        externalUrl: { type: [string, 'null'] }
        datePublished: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
        body:
          type: array
          items:
            $ref: '#/components/schemas/InsightBlock'
        coverImageUrl: { type: [string, 'null'] }
        coverImageAlt: { type: string }
        seoTitle: { type: [string, 'null'] }
        seoDescription: { type: [string, 'null'] }
        focusKeyphrase: { type: [string, 'null'] }
        canonicalUrl: { type: [string, 'null'] }
        status: { type: string }
        pinned: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
    InsightArticleInput:
      type: object
      required: [slug, title, excerpt, tag, body, status, coverImageAlt]
      properties:
        slug: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        excerpt: { type: string }
        tag: { type: string }
        externalUrl: { type: [string, 'null'] }
        datePublished: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
        body:
          type: array
          items:
            $ref: '#/components/schemas/InsightBlock'
        coverMediaId: { type: [string, 'null'] }
        coverImageUrl: { type: [string, 'null'] }
        coverImageAlt: { type: string }
        seoTitle: { type: [string, 'null'] }
        seoDescription: { type: [string, 'null'] }
        focusKeyphrase: { type: [string, 'null'] }
        canonicalUrl: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published] }
        pinned: { type: boolean }
    InsightMedia:
      type: object
      required: [id, fileName, contentType, sizeBytes, publicUrl, altText, createdAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: string }
        objectPath: { type: [string, 'null'] }
        publicUrl: { type: string }
        altText: { type: string }
        createdAt: { type: string, format: date-time }
    InsightMediaInput:
      type: object
      required: [id, fileName, contentType, sizeBytes, publicUrl, altText]
      properties:
        id: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: string }
        objectPath: { type: [string, 'null'] }
        publicUrl: { type: string }
        altText: { type: string }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
