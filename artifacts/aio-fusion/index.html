<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default title/description — overridden per-page by PageHead (client) or prerender (build) -->
    <title>AIO Fusion — GEO Platform for PR &amp; Marketing Teams</title>
    <meta name="description" content="Track, score and grow your brand's visibility across AI search engines like ChatGPT and Claude. Built for PR agencies and in-house communications teams." />

    <!-- Canonical — overridden per pre-rendered route -->
    <link rel="canonical" href="https://aiofusion.ai/" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AIO Fusion" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="AIO Fusion — GEO Platform for PR &amp; Marketing Teams" />
    <meta property="og:description" content="Track, score and grow your brand's visibility across AI search engines like ChatGPT and Claude. Built for PR agencies and in-house communications teams." />
    <meta property="og:url" content="https://aiofusion.ai/" />
    <meta property="og:image" content="https://aiofusion.ai/opengraph.jpg" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AIO Fusion — GEO Platform for PR &amp; Marketing Teams" />
    <meta name="twitter:description" content="Track, score and grow your brand's visibility across AI search engines like ChatGPT and Claude. Built for PR agencies and in-house communications teams." />
    <meta name="twitter:image" content="https://aiofusion.ai/opengraph.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DTSDJVJN0Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DTSDJVJN0Q');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Public routes are prerendered into #root for crawlers. OAuth, reset,
      // checkout, and account email links share that root URL but are not
      // marketing pages. Replace the static marketing markup before the module
      // loads so an auth callback never flashes or hydrates the wrong page.
      (function () {
        var authKeys = [
          "oauth_status", "link_google", "needs_setup", "verify_status", "reset_token",
          "discount_invite", "delete_reauth", "aio_exit_impersonation", "aio_switched_master",
          "aio_switched_workspace", "aio_session_expired", "account_section", "checkout"
        ];
        var params = new URLSearchParams(window.location.search);
        if (!authKeys.some(function (key) { return params.has(key); })) return;
        var root = document.getElementById("root");
        if (!root) return;
        root.setAttribute("data-auth-redirect", "true");
        root.innerHTML =
          '<div role="status" aria-label="Loading sign in" style="min-height:100vh;background:#fff;color:#0a1628;font-family:Inter,sans-serif">' +
            '<div style="background:#1A647B;height:86px"></div>' +
            '<div style="max-width:1280px;margin:0 auto;padding:40px 24px">' +
              '<div style="height:28px;width:145px;border-radius:999px;background:#C8497A;margin-bottom:20px"></div>' +
              '<div style="background:#1A647B;border-radius:16px;padding:64px 24px;text-align:center;color:#fff;box-shadow:0 8px 24px -12px rgba(26,100,123,.35)">' +
                '<span style="display:inline-block;width:22px;height:22px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;vertical-align:middle;margin-right:12px;animation:aio-auth-spin .8s linear infinite"></span>' +
                'Preparing secure sign in…' +
              '</div>' +
            '</div>' +
          '</div>';
      })();
    </script>
    <style>@keyframes aio-auth-spin { to { transform: rotate(360deg); } }</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
