kind = "web"
previewPath = "/"
title = "AIO Fusion Demo"
version = "1.0.0"
id = "artifacts/aio-fusion"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18664

[services.development]
run = "pnpm --filter @workspace/aio-fusion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aio-fusion", "run", "build" ]
publicDir = "artifacts/aio-fusion/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18664"
BASE_PATH = "/"
